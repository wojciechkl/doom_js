<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Unicorn Doom - Map Editor</title>
    <style>
        body { 
            margin: 0; 
            background: #222; 
            color: white; 
            font-family: monospace; 
            display: flex; 
            flex-direction: column; 
            align-items: center; 
            justify-content: center; 
            height: 100vh; 
            overflow: hidden;
        }
        #container { 
            display: flex; 
            border: 4px solid #555; 
            background: #000;
            position: relative;
        }
        canvas { display: block; }
        .ui {
            position: absolute;
            top: 10px;
            left: 10px;
            background: rgba(0,0,0,0.8);
            padding: 15px;
            border-radius: 8px;
            pointer-events: none;
            line-height: 1.4;
            border: 1px solid #444;
            z-index: 5;
        }
        /* Only covers the left side now */
        #gameOverlay {
            position: absolute;
            top: 0; left: 0; width: 640px; height: 480px;
            background: rgba(0,0,0,0.6);
            display: flex;
            justify-content: center;
            align-items: center;
            font-size: 24px;
            color: #ffcc00;
            z-index: 10;
            cursor: pointer;
            user-select: none;
        }
        /* Custom Context Menu */
        #contextMenu {
            position: absolute;
            background: #444;
            border: 2px solid #888;
            color: white;
            display: none;
            z-index: 1000;
            padding: 5px 0;
            box-shadow: 3px 3px 10px black;
        }
        .menu-item {
            padding: 8px 20px;
            cursor: pointer;
            font-family: monospace;
        }
        .menu-item:hover {
            background: #666;
        }
    </style>
</head>
<body>

    <div id="gameOverlay">CLICK HERE TO START</div>

    <div class="ui">
        <b style="color: #ffcc00;">CONTROLS:</b><br>
        W/S & Arrows Up/Down : Move<br>
        A/D : Rotate | Arrows L/R : Strafe<br>
        Mouse (in Game Window) : Look<br>
        <hr>
        <b style="color: #00ffcc;">MAP EDITOR:</b><br>
        Left Click Map : Toggle Wall<br>
        Right Click Map : Add Unicorn
    </div>

    <div id="container">
        <canvas id="gameCanvas" width="640" height="480"></canvas>
        <canvas id="mapCanvas" width="480" height="480"></canvas>
    </div>

    <!-- Hidden Custom Right-Click Menu -->
    <div id="contextMenu">
        <div class="menu-item" onclick="addEnemyAtSelected()">Add Unicorn 🦄</div>
    </div>

<script>
/** GAME CONFIGURATION **/
const TILE_SIZE = 64;
const MAP_SIZE = 16; 
const FOV = Math.PI / 3; 
const RESOLUTION = 640; 

const gameCanvas = document.getElementById('gameCanvas');
const ctxG = gameCanvas.getContext('2d');
const mapCanvas = document.getElementById('mapCanvas');
const ctxM = mapCanvas.getContext('2d');
const gameOverlay = document.getElementById('gameOverlay');
const contextMenu = document.getElementById('contextMenu');

// Player State
const player = {
    x: 100, y: 100, angle: 0, speed: 3, rotSpeed: 0.05, mouseSensitivity: 0.003
};

let worldMap = [];
let enemies = [];
let lastClickedCell = { x: 0, y: 0 };

function initMap() {
    worldMap = [];
    enemies = [];
    for (let y = 0; y < MAP_SIZE; y++) {
        let row = [];
        for (let x = 0; x < MAP_SIZE; x++) {
            if (x === 0 || x === MAP_SIZE - 1 || y === 0 || y === MAP_SIZE - 1) row.push(1);
            else {
                let rand = Math.random();
                if (rand < 0.15) row.push(1);
                else if (rand < 0.2) {
                    row.push('E');
                    enemies.push({ x: x * TILE_SIZE + TILE_SIZE/2, y: y * TILE_SIZE + TILE_SIZE/2 });
                } else row.push(0);
            }
        }
        worldMap.push(row);
    }
    player.x = TILE_SIZE * 1.5;
    player.y = TILE_SIZE * 1.5;
}

/** MOUSE CAPTURE (LEFT SIDE ONLY) **/
gameOverlay.addEventListener('click', () => {
    gameCanvas.requestPointerLock();
});

document.addEventListener('pointerlockchange', () => {
    if (document.pointerLockElement === gameCanvas) {
        gameOverlay.style.display = 'none';
    } else {
        gameOverlay.style.display = 'flex';
    }
});

window.addEventListener('mousemove', e => {
    if (document.pointerLockElement === gameCanvas) {
        player.angle += e.movementX * player.mouseSensitivity;
    }
});

/** MAP EDITING LOGIC **/
mapCanvas.addEventListener('mousedown', e => {
    // Calculate which cell was clicked
    const rect = mapCanvas.getBoundingClientRect();
    const scale = mapCanvas.width / (MAP_SIZE * TILE_SIZE);
    const mouseX = e.clientX - rect.left;
    const mouseY = e.clientY - rect.top;
    
    const cellX = Math.floor(mouseX / (TILE_SIZE * scale));
    const cellY = Math.floor(mouseY / (TILE_SIZE * scale));
    lastClickedCell = { x: cellX, y: cellY };

    if (cellX < 0 || cellX >= MAP_SIZE || cellY < 0 || cellY >= MAP_SIZE) return;

    if (e.button === 0) { // Left Click: Toggle Wall
        const current = worldMap[cellY][cellX];
        if (current === 1) {
            worldMap[cellY][cellX] = 0;
        } else {
            // If it was an enemy, remove from enemies list first
            if (current === 'E') removeFromEnemies(cellX, cellY);
            worldMap[cellY][cellX] = 1;
        }
    }
});

// Prevent default browser menu on map canvas and show custom one
mapCanvas.addEventListener('contextmenu', e => {
    e.preventDefault();
    const rect = mapCanvas.getBoundingClientRect();
    contextMenu.style.display = 'block';
    contextMenu.style.left = e.pageX + 'px';
    contextMenu.style.top = e.pageY + 'px';
});

// Hide context menu when clicking elsewhere
window.addEventListener('click', () => {
    contextMenu.style.display = 'none';
});

function addEnemyAtSelected() {
    const { x, y } = lastClickedCell;
    if (x >= 0 && x < MAP_SIZE && y >= 0 && y < MAP_SIZE) {
        worldMap[y][x] = 'E';
        enemies.push({ x: x * TILE_SIZE + TILE_SIZE/2, y: y * TILE_SIZE + TILE_SIZE/2 });
    }
}

function removeFromEnemies(cx, cy) {
    const targetX = cx * TILE_SIZE + TILE_SIZE/2;
    const targetY = cy * TILE_SIZE + TILE_SIZE/2;
    enemies = enemies.filter(en => en.x !== targetX || en.y !== targetY);
}

/** INPUT HANDLING **/
const keys = {};
window.addEventListener('keydown', e => keys[e.code] = true);
window.addEventListener('keyup', e => keys[e.code] = false);

function update() {
    if (keys['KeyA']) player.angle -= player.rotSpeed;
    if (keys['KeyD']) player.angle += player.rotSpeed;
    
    let moveX = 0, moveY = 0;
    if (keys['KeyW'] || keys['ArrowUp']) {
        moveX += Math.cos(player.angle) * player.speed;
        moveY += Math.sin(player.angle) * player.speed;
    }
    if (keys['KeyS'] || keys['ArrowDown']) {
        moveX -= Math.cos(player.angle) * player.speed;
        moveY -= Math.sin(player.angle) * player.speed;
    }
    if (keys['ArrowLeft']) {
        moveX -= Math.sin(player.angle) * player.speed;
        moveY += Math.cos(player.angle) * player.speed;
    }
    if (keys['ArrowRight']) {
        moveX += Math.sin(player.angle) * player.speed;
        moveY -= Math.cos(player.angle) * player.speed;
    }

    if (worldMap[Math.floor(player.y / TILE_SIZE)][Math.floor((player.x + moveX) / TILE_SIZE)] !== 1) player.x += moveX;
    if (worldMap[Math.floor((player.y + moveY) / TILE_SIZE)][Math.floor(player.x / TILE_SIZE)] !== 1) player.y += moveY;
}

/** RENDERING ENGINE **/
function render() {
    ctxG.fillStyle = '#333'; ctxG.fillRect(0, 0, gameCanvas.width, gameCanvas.height/2);
    ctxG.fillStyle = '#666'; ctxG.fillRect(0, gameCanvas.height/2, gameCanvas.width, gameCanvas.height/2);

    const zBuffer = new Array(RESOLUTION).fill(Infinity);

    for (let i = 0; i < RESOLUTION; i++) {
        const rayAngle = (player.angle - FOV / 2) + (i / RESOLUTION) * FOV;
        let distance = 0, hitWall = false;
        const eyeX = Math.cos(rayAngle), eyeY = Math.sin(rayAngle);

        while (!hitWall && distance < 800) {
            distance += 2;
            let testX = Math.floor((player.x + eyeX * distance) / TILE_SIZE);
            let testY = Math.floor((player.y + eyeY * distance) / TILE_SIZE);
            if (testX < 0 || testX >= MAP_SIZE || testY < 0 || testY >= MAP_SIZE) { hitWall = true; distance = 800; } 
            else if (worldMap[testY][testX] === 1) hitWall = true;
        }

        const correctedDist = distance * Math.cos(rayAngle - player.angle);
        zBuffer[i] = correctedDist;
        const wallHeight = (TILE_SIZE * gameCanvas.height) / correctedDist;
        const brightness = Math.max(0, 255 - (correctedDist / 2));
        ctxG.fillStyle = `rgb(${brightness}, ${brightness * 0.8}, ${brightness * 0.5})`;
        ctxG.fillRect(i, (gameCanvas.height - wallHeight) / 2, 1, wallHeight);
    }

    enemies.forEach(enemy => {
        const dx = enemy.x - player.x;
        const dy = enemy.y - player.y;
        const distToEnemy = Math.sqrt(dx*dx + dy*dy);
        let angleToEnemy = Math.atan2(dy, dx) - player.angle;
        while (angleToEnemy < -Math.PI) angleToEnemy += 2 * Math.PI;
        while (angleToEnemy > Math.PI) angleToEnemy -= 2 * Math.PI;

        if (Math.abs(angleToEnemy) < FOV) {
            const screenX = (0.5 * (angleToEnemy / (FOV / 2)) + 0.5) * RESOLUTION;
            const spriteHeight = (TILE_SIZE * gameCanvas.height) / distToEnemy;
            if (distToEnemy < zBuffer[Math.floor(screenX)]) {
                ctxG.font = `${spriteHeight}px serif`;
                ctxG.textAlign = 'center';
                ctxG.fillText('🦄', screenX, (gameCanvas.height / 2) + (spriteHeight / 3));
            }
        }
    });

    drawMap();
}

function drawMap() {
    ctxM.fillStyle = '#000'; ctxM.fillRect(0, 0, mapCanvas.width, mapCanvas.height);
    const scale = mapCanvas.width / (MAP_SIZE * TILE_SIZE);

    for (let y = 0; y < MAP_SIZE; y++) {
        for (let x = 0; x < MAP_SIZE; x++) {
            if (worldMap[y][x] === 1) ctxM.fillStyle = '#888';
            else if (worldMap[y][x] === 'E') ctxM.fillStyle = '#f0f';
            else ctxM.fillStyle = '#222';
            ctxM.fillRect(x * TILE_SIZE * scale, y * TILE_SIZE * scale, TILE_SIZE * scale - 1, TILE_SIZE * scale - 1);
        }
    }

    const px = player.x * scale, py = player.y * scale;
    ctxM.fillStyle = 'yellow'; ctxM.beginPath();
    ctxM.moveTo(px, py);
    ctxM.lineTo(px + Math.cos(player.angle - FOV/2) * 30, py + Math.sin(player.angle - FOV/2) * 30);
    ctxM.lineTo(px + Math.cos(player.angle + FOV/2) * 30, py + Math.sin(player.angle + FOV/2) * 30);
    ctxM.closePath(); ctxM.fill();

    ctxM.fillStyle = 'white'; ctxM.beginPath(); ctxM.arc(px, py, 4, 0, Math.PI * 2); ctxM.fill();
}

function gameLoop() {
    update();
    render();
    requestAnimationFrame(gameLoop);
}

initMap();
gameLoop();
</script>
</body>
</html>
